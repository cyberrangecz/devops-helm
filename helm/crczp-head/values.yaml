global:
  headHost: 172.19.0.22
  tlsSecretName: crczp-certs
  crczpSyslogServiceName: crczp-syslog-ng
  crczpLogstashServiceName: crczp-logstash
  crczpOpensearchServiceName: crczp-opensearch.opensearch.svc.cluster.local
  guacamoleUser: guac-user
  guacamoleUserPassword: guac-user
  crczpTerraformBackendType: 'kubernetes'
  corsWhitelist:
  imageCredentials:
    registry: ghcr.io
    username:
    password:


  oidcProviders:
    - url:
      logoutUrl:
      clientId:
      label:
      issuerIdentifier:
      userInfoUrl:


  redis:
    serviceName: crczp-redis
    port: 6379
    db: 0

  postgres:
    serviceName: postgres-rw.cnpg-system.svc.cluster.local
    port: 5432
    user: postgres
    password: password

  postgresServices:
    answersStorage:
      dbName: crczp-answers-storage
      dbUser: crczp-answers-storage
      dbPassword: crczp-answers-storage
    guacamole:
      dbName: guacamole
      dbUser: guacamole
      dbPassword: guacamole
    sandbox:
      dbName: sandbox-service
      dbUser: sandbox-service
      dbPassword: sandbox-service
    training:
      dbName: training
      dbUser: training
      dbPassword: training
    userAndGroup:
      dbName: user-and-group
      dbUser: user-and-group
      dbPassword: user-and-group

  services:
    angularFrontend:
      name: angular-frontend
      port: 8000
      contextPath: /
      ingressAutoexpose: true
    answersStorage:
      name: answers-storage
      port: 8087
      contextPath: /answers-storage/api/v1/
    guacamole:
      name: guacamole-service
      port: 8089
      contextPath: /guacamole/api/v1/
      ingressAutoexpose: true
    mitre:
      name: mitre-service
      port: 8001
      contextPath: /mitre-technique-service/api/v1/
      ingressAutoexpose: true
    sandbox:
      name: sandbox-service
      port: 8000
      contextPath: /sandbox-service/api/v1/
      ingressAutoexpose: true
    training:
      name: training-service
      port: 8083
      contextPath: /training/api/v1/
      ingressAutoexpose: true
    userAndGroup:
      name: uag-service
      port: 8084
      contextPath: /user-and-group/api/v1/
