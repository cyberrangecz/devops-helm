replicasCount: 1

image:
  url: ghcr.io/cyberrangecz/backend-user-and-group/user-and-group-service
  tag: v1.4.2

environments:
  JAVA_TOOL_OPTIONS: "-XX:-UseBASE64Intrinsics"  # CVE-2026-114938 stopgap until the JDK is patched

mounts:
  configs:
    mountPath: /app/etc/
    isOneFile: true
    subPath: false
    type:
      configMap:
        name: uag-service-configmap
    items:
      - name: user-and-group
        extension: .properties
      - name: initial-users
        extension: .yml
      - name: exported-local-oidc-users
        extension: .yml
  tls:
    extension: .crt
    mountPath: /srv/
    isOneFile: true
    subPath: false
    type:
      secret:
        secretName: crczp-certs

connectionTimeout:
maximumPoolSize:
