replicasCount: 1

image:
  url: ghcr.io/cyberrangecz/backend-training/training-service
  tag: v2.4.0

environments:
  JAVA_TOOL_OPTIONS: "-XX:-UseBASE64Intrinsics"  # CVE-2026-114938 stopgap until the JDK is patched
  SERVICE_PRECONDITION: uag-service:8084

mounts:
  training:
    extension: .properties
    mountPath: /app/etc/
    isOneFile: true
    subPath: false
    type:
      configMap:
        name: training-service-configmap
    items:
      - name: training
        extension: .properties
      - name: logback-spring
        extension: .xml
  tls:
    extension: .crt
    mountPath: /srv/
    isOneFile: true
    subPath: false
    type:
      secret:
        secretName: crczp-certs

connectionTimeout:
maximumPoolSize:
