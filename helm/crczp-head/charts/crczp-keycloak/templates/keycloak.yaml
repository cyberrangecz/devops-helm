apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ .Values.name }}
  labels: {{- include "common.labels" (dict "name" .Values.name "chart" $.Chart "release" $.Release "extraLabels" $.extraLabels) | nindent 4 }}
spec:
  instances: 1
  db:
    vendor: postgres
    host: {{ $.Values.global.postgres.serviceName }}
    port: {{ $.Values.global.postgres.port }}
    database: {{ .Values.db.database }}
    usernameSecret:
      name: {{ .Values.name }}-secrets
      key: username
    passwordSecret:
      name: {{ .Values.name }}-secrets
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-admin
  http:
    httpEnabled: true
    httpPort: 8080
  ingress:
    enabled: false
  hostname:
    hostname: "https://{{ $.Values.global.headHost }}/keycloak"
    backchannelDynamic: true
  proxy:
    headers: xforwarded
  serviceMonitor:
    enabled: false
  additionalOptions:
    - name: http-relative-path
      value: /keycloak
