apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakRealm
metadata:
  name: crczp-realm
spec:
  instanceRef:
    name: keycloak-instance
  realmName: {{ .Values.realm }}
  definition:
    displayName: "{{ .Values.realm }} Realm"
    enabled: true
    defaultDefaultClientScopes:
      - email
      - profile
      - openid
---
# Custom "openid" scope carrying the sub -> email remap. email/profile/offline_access
# are Keycloak built-ins and are intentionally not re-declared here.
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClientScope
metadata:
  name: crczp-openid-scope
spec:
  realmRef:
    name: crczp-realm
  name: openid
  definition:
    protocol: openid-connect
---
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakProtocolMapper
metadata:
  name: crczp-openid-sub-mapper
spec:
  clientScopeRef:
    name: crczp-openid-scope
  name: sub
  definition:
    protocol: openid-connect
    protocolMapper: oidc-usermodel-property-mapper
    config:
      user.attribute: email
      claim.name: sub
      jsonType.label: String
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
