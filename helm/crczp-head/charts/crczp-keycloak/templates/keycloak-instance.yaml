apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  username: {{ .Values.keycloakAdmin }}
  password: {{ .Values.keycloakPassword }}
---
apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakInstance
metadata:
  name: keycloak-instance
spec:
  # FQDN + /keycloak: the operator runs in its own namespace and the server uses
  # http-relative-path=/keycloak, so a bare service name or missing path fails.
  baseUrl: http://keycloak-service.crczp.svc.cluster.local:8080/keycloak
  realm: master
  auth:
    passwordGrant:
      secretRef:
        name: keycloak-admin
        usernameKey: username
        passwordKey: password
