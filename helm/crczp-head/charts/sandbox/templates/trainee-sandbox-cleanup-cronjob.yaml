{{- if (.Values.traineeSandboxCleanup | default dict).enabled }}
{{- include "sandbox.netbirdMount" . -}}
{{- $cleanupValues := deepCopy .Values }}
{{- $_ := set $cleanupValues "mounts" (omit .Values.mounts "ansible-runner-vol") }}
{{- $name := print .Values.global.services.sandbox.name "-trainee-sandbox-cleanup" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels" (dict "name" $name "chart" .Chart "release" .Release "extraLabels" .Values.extraLabels) | nindent 4 }}
spec:
  schedule: {{ .Values.traineeSandboxCleanup.schedule | default "0 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {{- include "common.labels" (dict "name" $name "chart" .Chart "release" .Release "extraLabels" .Values.extraLabels) | nindent 12 }}
        spec:
          serviceAccountName: sandbox-service
          restartPolicy: Never
          {{- if .Values.global.imageCredentials.username }}
          imagePullSecrets:
            - name: github-auth-secret
          {{- end }}
{{- include "common.deployment.containers" (dict "name" $name "Values" $cleanupValues "command" "sh" "args" "[\"-c\",\"update-ca-certificates && python3 manage.py cleanup_trainee_sandboxes\"]" "portsDisabled" true) | indent 4 }}
{{- include "common.deployment.volumes" (dict "Values" $cleanupValues) | indent 4 }}
{{- end }}
