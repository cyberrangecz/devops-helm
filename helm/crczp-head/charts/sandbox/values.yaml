replicasCount: 1

image:
  url: ghcr.io/cyberrangecz/backend-sandbox-platform/sandbox-service
  tag: v4.0.0

environments:
  SERVICE_PRECONDITION: "uag-service:8084"
  DJANGO_ADMIN_USER: crczp-admin
  DJANGO_ADMIN_PASSWORD:
  DJANGO_ADMIN_EMAIL: crczp-admin@example.com

mounts:
  config:
    extension: .yml
    mountPath: /app/
    isOneFile: true
    subPath: true
    type:
      secret:
        secretName: sandbox-service-secret
  tls:
    extension: .crt
    mountPath: /usr/local/share/ca-certificates/
    isOneFile: true
    subPath: true
    type:
      secret:
        secretName: crczp-certs
  proxy-key:
    extension: ""
    mountPath: /root/.ssh/
    isOneFile: true
    subPath: true
    mode: '0600'
    type:
      secret:
        secretName: proxy-key
  ansible-runner-vol:
    extension: ""
    mountPath: /var/opt/crczp/ansible-runner-volumes
    isOneFile: false
    type:
      persistentVolumeClaim:
        claimName: sandbox-service

pvc:
  enabled: true
  size: 1Gi
  storageClassName: local-path
  accessMode: ReadWriteOnce

stackNamePrefix: default0
dnsNameServers:
  - 1.1.1.1
  - 1.0.0.1
syslogDestinationPort: 515
openstackWorkerCount: 4
ansibleWorkerCount: 4
defaultWorkerCount: 4
sandboxBuildTimeout: 7200
sandboxDeleteTimeout: 3600
sandboxAnsibleTimeout: 7200
manFlavor: standard.small
manImage: ubuntu-noble-x86_64
manUser: ubuntu
sandboxManCidr:
proxyHost:
proxyUser:
proxyKey:
proxyPort:
ansibleDockerNetwork: host
djangoSecretKey:
flavorMapping: {}

smtpServer:
smtpPort: 25
senderEmail: "sandbox.service@crczp.cz"
senderEmailPassword:
smtpEncryption:

networkForwardingEnabled: false

# Cleanup of the sandboxes trainees allocate for themselves, run by a CronJob.
expiredTraineeSandboxDeletion:
  # Whether scheduled runs are started; runs created manually from the CronJob still work.
  suspend: false
  # Cron schedule of the CronJob.
  schedule: "0 * * * *"
  # Seconds a scheduled run may start late before it is skipped.
  startingDeadlineSeconds: 1800
  # Number of finished successful jobs kept.
  successfulJobsHistoryLimit: 1
  # Number of finished failed jobs kept.
  failedJobsHistoryLimit: 3
  # Seconds a job may run before it is terminated.
  activeDeadlineSeconds: 3300
  # Container resource requests and limits; empty sets none.
  resources: {}
  # Hours a trainee keeps their sandbox before the cleanup removes it.
  maxAgeHours: 24

# Detection of sandbox work whose job was lost, run by a CronJob.
stalledSandboxRecovery:
  # Whether scheduled runs are started; runs created manually from the CronJob still work.
  suspend: true
  # Cron schedule of the CronJob.
  schedule: "* * * * *"
  # Seconds a scheduled run may start late before it is skipped.
  startingDeadlineSeconds: 30
  # Number of finished successful jobs kept.
  successfulJobsHistoryLimit: 1
  # Number of finished failed jobs kept.
  failedJobsHistoryLimit: 3
  # Seconds a job may run before it is terminated.
  activeDeadlineSeconds: 50
  # Container resource requests and limits; empty sets none.
  resources: {}
  # Seconds a dead stage job may wait before the detection fails its stage.
  graceSeconds: 60

# Removal of the stacks that no allocation unit owns, run by a CronJob.
orphanedCloudResourceDeletion:
  # Whether scheduled runs are started; runs created manually from the CronJob still work.
  suspend: true
  # Cron schedule of the CronJob.
  schedule: "*/15 * * * *"
  # Seconds a scheduled run may start late before it is skipped.
  startingDeadlineSeconds: 450
  # Number of finished successful jobs kept.
  successfulJobsHistoryLimit: 1
  # Number of finished failed jobs kept.
  failedJobsHistoryLimit: 3
  # Seconds a job may run before it is terminated.
  activeDeadlineSeconds: 840
  # Container resource requests and limits; empty sets none.
  resources: {}

redis:
  defaultCacheTimeout: 86400
  uagCacheTimeout: 86400
  topologyCacheTimeout: 86400

ansibleRunner:
  image:
    url: ghcr.io/cyberrangecz/crczp-ansible-runner
    tag: 1.3.0

gitConfig:
  providers: {}
  #providers: {"https://github.com/": "TOKEN"}
  user: git
  ansibleNetworkingUrl: https://github.com/cyberrangecz/ansible-stage-one.git
  ansibleNetworkingRev: v2.3.0
  topologyCacheMode: AGGRESSIVE

openstack:
  authUrl:
  applicationCredentialId:
  applicationCredentialSecret:
  consoleType:

aws:
  accessKeyId:
  secretAccessKey:
  region: eu-central-1
  availabilityZone: eu-central-1a
  baseVpc: BaseNet
  baseSubnet: BaseSubnetA

keystoneCA:

netbird:
  managementUrl: http://netbird-server.netbird.svc.cluster.local
  clientManagementUrl:
  serviceUserPatFilePath: /srv/netbird-pat/pat
  keyExpirySeconds: 604800
